[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "violet-monarchs"
version = "0.1.0"
description = "Project description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]